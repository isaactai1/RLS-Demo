# Render Blueprint — RLS Demo (full app: Index + Research tools + API)
# Deploy: Dashboard → New → Blueprint → connect this repo
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: rls-demo
    runtime: node
    plan: free
    buildCommand: npm install && node scripts/generate-tools.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: POE_API_KEY
        sync: false
      - key: POE_MODEL
        value: gemini-3.1-flash-lite
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        value: b34bd47e-6a11-414f-bee7-5d51d79994e7
      - key: NOTION_DATA_SOURCE_ID
        value: f9213e70-6aff-4b5f-8cf5-cf0e72db0382
      - key: NOTION_DEMO_URL
        value: https://www.notion.so/b34bd47e6a11414fbee75d51d79994e7
      - key: ADHD_DATA_SOURCE_ID
        value: 43f2ce3e-5022-4549-9c59-1b4524bf5ea5
      - key: ADHD_DEMO_URL
        value: https://www.notion.so/77e155aa30b94b5a9f28e9dc56448e63
